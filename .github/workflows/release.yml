name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; pnpm publish delegates
      # the actual upload to the npm CLI, so the bundled version matters.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Compare version with registry
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view retransmit.dev version 2>/dev/null || echo "0.0.0")
          echo "local: $LOCAL, published: $PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Auth via npm Trusted Publishing (OIDC). No token needed.
      # Requires the trusted publisher configured on npmjs.com for retransmit.dev
      # (GitHub Actions, retransmit-dev/retransmit-node, release.yml) and id-token: write above.
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: pnpm publish --access public --no-git-checks
